name: Build Android APK

on:
  workflow_dispatch:
  push:
    branches: [claude/money-transaction-tracker-h8acv7]
    paths: ['app/**', '.github/workflows/android-apk.yml']

permissions:
  contents: write

jobs:
  apk:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: app/package-lock.json
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - run: npm ci
      - run: npm test
      - run: npx expo prebuild --platform android --no-install
      - name: Build release APK
        run: ./gradlew assembleRelease --no-daemon
        working-directory: app/android
      - name: Publish APK as a GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cp android/app/build/outputs/apk/release/app-release.apk Flusi.apk
          gh release create "apk-${{ github.run_number }}" Flusi.apk \
            --title "Flusi APK #${{ github.run_number }}" \
            --notes "Install on Android: download Flusi.apk, open it, allow installs from this source." \
            --target "${{ github.sha }}"
